<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mission Control — MT5 Fleet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0C1017; --panel:#131A24; --panel2:#0F151E; --line:#223042;
    --gold:#E8B33C; --gold-dim:#8a6a24;
    --up:#3DDC97; --down:#FF5C5C; --idle:#5B6B7E;
    --text:#D7DEE8; --muted:#7C8A9C;
    --mono:'IBM Plex Mono',monospace; --disp:'Chakra Petch',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--ink);color:var(--text);font-family:var(--mono);font-size:14px;min-height:100vh}

  /* command bar */
  header{display:flex;align-items:center;gap:16px;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--panel2)}
  header h1{font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:.14em;text-transform:uppercase}
  header h1 span{color:var(--gold)}
  .clock{color:var(--muted);font-size:12px;margin-left:auto}
  .killall{background:none;border:1px solid var(--down);color:var(--down);font-family:var(--disp);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:12px;padding:8px 14px;cursor:pointer;transition:.15s}
  .killall:hover{background:var(--down);color:var(--ink)}

  main{display:grid;grid-template-columns:1fr 320px;gap:18px;padding:18px 22px;max-width:1400px;margin:0 auto}
  @media(max-width:900px){main{grid-template-columns:1fr}}

  .eyebrow{font-family:var(--disp);font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}

  /* fleet drop zone */
  #fleet{border:1px dashed transparent;transition:.2s;min-height:220px;padding:4px}
  #fleet.dragging{border-color:var(--gold);background:rgba(232,179,60,.05)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}

  /* bot pod card — signature status rail on left edge */
  .pod{position:relative;background:var(--panel);border:1px solid var(--line);padding:16px 16px 14px 22px;cursor:pointer;transition:border-color .15s}
  .pod:hover{border-color:var(--gold-dim)}
  .pod.selected{border-color:var(--gold)}
  .pod::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--idle)}
  .pod.running::before{background:var(--up);animation:pulse 1.6s ease-in-out infinite}
  .pod.crashed::before{background:var(--down)}
  @keyframes pulse{50%{opacity:.35}}
  @media(prefers-reduced-motion:reduce){.pod.running::before{animation:none}}

  .pod h3{font-family:var(--disp);font-size:15px;font-weight:600;letter-spacing:.03em;word-break:break-all}
  .pod .meta{display:flex;gap:12px;color:var(--muted);font-size:11.5px;margin:6px 0 12px}
  .pod .meta .st-running{color:var(--up)} .pod .meta .st-crashed{color:var(--down)}
  .pod select{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);font-family:var(--mono);font-size:12.5px;padding:7px 8px;margin-bottom:10px}
  .pod .row{display:flex;gap:8px}
  .btn{flex:1;font-family:var(--disp);font-weight:600;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;padding:9px 0;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer;transition:.15s}
  .btn:focus-visible,.killall:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
  .btn.play{border-color:var(--up);color:var(--up)} .btn.play:hover{background:var(--up);color:var(--ink)}
  .btn.stop{border-color:var(--down);color:var(--down)} .btn.stop:hover{background:var(--down);color:var(--ink)}
  .btn.trash{flex:0 0 44px;color:var(--muted)} .btn.trash:hover{color:var(--down);border-color:var(--down)}

  .dropzone-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:200px;color:var(--muted);border:1px dashed var(--line);gap:8px;text-align:center;padding:20px}
  .dropzone-empty b{font-family:var(--disp);color:var(--text);letter-spacing:.08em;text-transform:uppercase}

  /* accounts rail */
  aside .panel{background:var(--panel);border:1px solid var(--line);padding:16px}
  .acct{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px}
  .acct:last-of-type{border-bottom:none}
  .acct small{display:block;color:var(--muted)}
  .acct button{background:none;border:none;color:var(--muted);cursor:pointer;font-family:var(--mono);font-size:15px}
  .acct button:hover{color:var(--down)}
  form.addacct{display:grid;gap:8px;margin-top:14px}
  form.addacct input{background:var(--panel2);border:1px solid var(--line);color:var(--text);font-family:var(--mono);font-size:12.5px;padding:8px}
  form.addacct button{font-family:var(--disp);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:12px;padding:9px;background:none;border:1px solid var(--gold);color:var(--gold);cursor:pointer}
  form.addacct button:hover{background:var(--gold);color:var(--ink)}

  /* log drawer */
  #logwrap{grid-column:1/-1;background:var(--panel2);border:1px solid var(--line)}
  #logtitle{padding:10px 16px;border-bottom:1px solid var(--line);font-family:var(--disp);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
  #logs{height:260px;overflow-y:auto;padding:12px 16px;font-size:12.5px;line-height:1.65;white-space:pre-wrap;color:#A9B7C6}
  #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--gold);color:var(--gold);padding:10px 18px;font-size:12.5px;opacity:0;pointer-events:none;transition:.25s}
  #toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <h1>Mission<span> Control</span></h1>
  <span class="clock" id="clock"></span>
  <button class="killall" onclick="stopAll()">⏻ Stop all bots</button>
</header>

<main>
  <section>
    <div class="eyebrow">Fleet — drop .py bots anywhere below</div>
    <div id="fleet"><div class="grid" id="grid"></div></div>
  </section>

  <aside>
    <div class="eyebrow">MT5 Accounts</div>
    <div class="panel">
      <div id="accts"></div>
      <form class="addacct" onsubmit="addAccount(event)">
        <input id="a-label" placeholder="Label (e.g. ICM Demo)" required>
        <input id="a-login" placeholder="Login" type="number" required>
        <input id="a-pass" placeholder="Password" type="password" required>
        <input id="a-server" placeholder="Server (e.g. ICMarketsSC-Demo)" required>
        <button>+ Add account</button>
      </form>
    </div>
  </aside>

  <div id="logwrap">
    <div id="logtitle">Console — select a bot</div>
    <div id="logs">No bot selected.</div>
  </div>
</main>

<div id="toast"></div>

<script>
let state = {bots:[], accounts:[]};
let selected = null;
const $ = id => document.getElementById(id);

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2500); }
async function api(path, opts={}){
  const r = await fetch(path, opts);
  if(!r.ok){ const e = await r.json().catch(()=>({detail:'Request failed'})); toast(e.detail||'Request failed'); throw new Error(e.detail); }
  return r.json();
}

function fmtUptime(s){ if(!s) return ''; const h=Math.floor(s/3600),m=Math.floor(s%3600/60); return h?`${h}h ${m}m`:`${m}m ${s%60}s`; }

function render(){
  const grid = $('grid');
  if(!state.bots.length){
    grid.innerHTML = `<div class="dropzone-empty" style="grid-column:1/-1">
      <b>No bots deployed</b>
      <span>Drag your bot files here — gold_session_pro.py, pod_london.py, the whole fleet.</span></div>`;
  } else {
    grid.innerHTML = state.bots.map(b=>{
      const running = b.status==='running';
      const opts = state.accounts.map(a=>`<option value="${a.label}">${a.label} · ${a.login}</option>`).join('');
      return `<div class="pod ${b.status} ${selected===b.name?'selected':''}" onclick="selectBot('${b.name}')">
        <h3>${b.name}</h3>
        <div class="meta">
          <span class="st-${b.status}">● ${b.status.toUpperCase()}</span>
          ${running?`<span>▲ ${fmtUptime(b.uptime)}</span>`:''}
          ${b.account?`<span>${b.account}</span>`:''}
          <span>${b.size_kb} KB</span>
        </div>
        ${!running?`<select id="acct-${cssId(b.name)}" onclick="event.stopPropagation()">
            <option value="">No account (bot's own creds)</option>${opts}</select>`:''}
        <div class="row">
          ${running
            ? `<button class="btn stop" onclick="event.stopPropagation();stopBot('${b.name}')">■ Stop</button>`
            : `<button class="btn play" onclick="event.stopPropagation();startBot('${b.name}')">▶ Play</button>
               <button class="btn trash" title="Remove bot" onclick="event.stopPropagation();removeBot('${b.name}')">✕</button>`}
        </div>
      </div>`;
    }).join('');
  }
  $('accts').innerHTML = state.accounts.length
    ? state.accounts.map(a=>`<div class="acct"><div>${a.label}<small>${a.login} · ${a.server}</small></div>
        <button title="Remove" onclick="removeAccount('${a.label}')">✕</button></div>`).join('')
    : `<div style="color:var(--muted);font-size:12.5px;padding:6px 0 2px">No accounts yet — add one below.</div>`;
}

function cssId(s){ return s.replace(/[^a-z0-9]/gi,'_'); }
function selectBot(name){ selected = name; $('logtitle').textContent = 'Console — '+name; render(); pollLogs(); }

async function refresh(){ state = await api('/api/state'); render(); }
async function startBot(name){
  const sel = $('acct-'+cssId(name));
  await api(`/api/bots/${encodeURIComponent(name)}/start`, {method:'POST',headers:{'Content-Type':'application/json'},
    body: JSON.stringify({account_label: sel && sel.value ? sel.value : null})});
  toast('▶ '+name+' launched'); selectBot(name); refresh();
}
async function stopBot(name){ await api(`/api/bots/${encodeURIComponent(name)}/stop`,{method:'POST'}); toast('■ '+name+' stopped'); refresh(); }
async function removeBot(name){ if(!confirm('Remove '+name+' from the fleet?'))return; await api(`/api/bots/${encodeURIComponent(name)}`,{method:'DELETE'}); refresh(); }
async function stopAll(){ await api('/api/stop-all',{method:'POST'}); toast('All bots stopped'); refresh(); }

async function addAccount(e){
  e.preventDefault();
  await api('/api/accounts',{method:'POST',headers:{'Content-Type':'application/json'},
    body: JSON.stringify({label:$('a-label').value, login:+$('a-login').value, password:$('a-pass').value, server:$('a-server').value})});
  e.target.reset(); toast('Account added'); refresh();
}
async function removeAccount(label){ if(!confirm('Remove account '+label+'?'))return; await api('/api/accounts/'+encodeURIComponent(label),{method:'DELETE'}); refresh(); }

async function pollLogs(){
  if(!selected) return;
  const d = await api(`/api/bots/${encodeURIComponent(selected)}/logs`);
  const el = $('logs');
  const stick = el.scrollTop + el.clientHeight >= el.scrollHeight - 30;
  el.textContent = d.lines.length ? d.lines.join('\n') : 'No output yet — start the bot to see its console here.';
  if(stick) el.scrollTop = el.scrollHeight;
}

/* drag & drop deploy */
const fleet = $('fleet');
['dragenter','dragover'].forEach(ev=>fleet.addEventListener(ev,e=>{e.preventDefault();fleet.classList.add('dragging');}));
['dragleave','drop'].forEach(ev=>fleet.addEventListener(ev,e=>{e.preventDefault();fleet.classList.remove('dragging');}));
fleet.addEventListener('drop', async e=>{
  for(const f of e.dataTransfer.files){
    if(!f.name.endsWith('.py')){ toast(f.name+' skipped — .py only'); continue; }
    const fd = new FormData(); fd.append('file', f);
    await api('/api/bots/upload',{method:'POST',body:fd});
    toast('Deployed '+f.name);
  }
  refresh();
});

setInterval(()=>{ $('clock').textContent = new Date().toLocaleTimeString('en-GB'); },1000);
setInterval(refresh, 2000);
setInterval(pollLogs, 2000);
refresh();
</script>
</body>
</html>
